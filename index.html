<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJ Almela | En Construcción</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFB800;
            --dark: #0A0E27;
            --text: #d0d8f0;
        }

        body {
            background-color: var(--dark);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .container {
            padding: 2rem;
            max-width: 600px;
            border: 1px solid rgba(255, 184, 0, 0.1);
            border-radius: 12px;
            background: rgba(13, 18, 40, 0.5);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            opacity: 0.8;
            line-height: 1.6;
        }

        .divider {
            width: 50px;
            height: 2px;
            background-color: var(--gold);
            margin: 2rem auto;
        }

        .status {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--gold);
            opacity: 0.6;
        }

        /* Subtle animation */
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 0.8; }
            100% { opacity: 0.4; }
        }

        .pulse {
            animation: pulse 3s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status pulse">Próximamente</div>
        <h1>JJ Almela</h1>
        <div class="divider"></div>
        <p>Estamos trabajando en algo especial.<br>Música, elegancia y producción en proceso.</p>
        <p style="font-size: 0.9rem; margin-top: 2rem; opacity: 0.5;">© 2026 JJ Almela · Universo EDUSSE</p>
    </div>

</body>
</html>
